<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    
  </style>
</head>
<body>


  <main>
    <article class="card-container">
      <img src="images/image-product-desktop.jpg" class="desktop-img" alt="Gabrielle Essence Eau De Parfum in a bottle on a beige surface with plants.">
      <img src="images/image-product-mobile.jpg" class="mobile-img" alt="Gabrielle Essence Eau De Parfum in a bottle on a beige surface with plants.">
  <p class="card-title">Perfume</p>

  <h1>Gabrielle Essence Eau De Parfum</h1>

  <div>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</div>

  <div class="sale-price">$149.99
  <s class="reg-price">$169.99</s>
  </div>

  <button>Add to Cart</button>
    </article> <!-- end of card-container-->
  </main>

  <footer class="attribution">
    Challenge by &thinsp; <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by &thinsp;<a href="https://itsocodedesign.ca/">Andrea Dyson</a>.
  </footer>
</body>
</html>
