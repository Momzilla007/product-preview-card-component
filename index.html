<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!--font links-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!--css stylesheets-->
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>


  <main>
    <article class="card-component">
      <div class="left-side">
      <img src="images/image-product-desktop.jpg" class="desktop-img" width="600" height="900" alt="Gabrielle Essence Eau De Parfum in a bottle on a beige surface with plants.">
      <img src="images/image-product-mobile.jpg" class="mobile-img" width="700" height="684" alt="Gabrielle Essence Eau De Parfum in a bottle on a beige surface with plants.">
      </div> <!--end of left-side-->

      <div class="right-side">
      <p class="card-title">Perfume</p>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <div>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</div>

      <div class="sale-price">$149.99
      <s class="reg-price">$169.99</s>
      </div>

      <button>Add to Cart</button>
      </div><!-- end of right-side-->
    </article> <!-- end of card-container-->
  </main>

  <footer class="attribution">
    Challenge by &thinsp; <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by &thinsp;<a href="https://itsocodedesign.ca/">Andrea Dyson</a>.
  </footer>
</body>
</html>
